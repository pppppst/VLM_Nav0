# Humble plugins.xml and nav2_bringup defaults checked locally.
amcl:
  ros__parameters:
    use_sim_time: false
    global_frame_id: map
    odom_frame_id: odom
    base_frame_id: base_link
    scan_topic: /scan_amcl
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    laser_model_type: likelihood_field_prob
    do_beamskip: false
    alpha1: 0.1
    alpha2: 0.1
    alpha3: 0.1
    alpha4: 0.1
    alpha5: 0.2
    min_particles: 500
    max_particles: 2000
    max_beams: 120
    update_min_a: 0.2
    update_min_d: 0.25
    tf_broadcast: true
    set_initial_pose: false
