# Go2 Plan A navigation profile. Footprint and obstacle heights remain blocked
# in robot_go2.yaml until measured; this file only defines controller semantics.
controller_server:
  ros__parameters:
    controller_frequency: 20.0
    progress_checker_plugins: [progress_checker]
    goal_checker_plugins: [general_goal_checker]
    controller_plugins: [FollowPath]
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.10
      movement_time_allowance: 15.0
    general_goal_checker:
      plugin: nav2_controller::PositionGoalChecker
      xy_goal_tolerance: 0.25
      stateful: true
    FollowPath:
      plugin: dwb_core::DWBLocalPlanner
      trajectory_generator_name: vlm_nav::ComponentwiseMinSpeedGenerator
      min_vel_x: 0.0
      min_vel_y: 0.0
      max_vel_x: 0.40
      max_vel_y: 0.0
      max_vel_theta: 0.50
      min_speed_xy: 0.40
      max_speed_xy: 0.40
      min_speed_theta: 0.50
      acc_lim_x: 0.50
      acc_lim_y: 0.0
      acc_lim_theta: 0.50
      decel_lim_x: -0.50
      decel_lim_y: 0.0
      decel_lim_theta: -0.50
      vx_samples: 12
      vy_samples: 1
      vtheta_samples: 20
      sim_time: 1.0
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.50
      short_circuit_trajectory_evaluation: true
      stateful: true
      critics: [RotateToGoal, Oscillation, ObstacleFootprint, GoalAlign, PathAlign, PathDist, GoalDist]
      ObstacleFootprint.scale: 0.02
      PathAlign.scale: 32.0
      GoalAlign.scale: 24.0
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0

velocity_smoother:
  ros__parameters:
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: OPEN_LOOP
    max_velocity: [0.40, 0.0, 0.50]
    min_velocity: [-0.40, 0.0, -0.50]
    max_accel: [0.50, 0.0, 0.50]
    max_decel: [-0.50, 0.0, -0.50]
    odom_topic: /odometry
    odom_duration: 0.1
    deadband_velocity: [0.40, 0.0, 0.50]
    velocity_timeout: 0.5

global_costmap:
  global_costmap:
    ros__parameters:
      global_frame: map
      robot_base_frame: base_link
      # Measured Go2 footprint; no additional padding.
      footprint: "[[0.38, 0.18], [0.38, -0.18], [-0.38, -0.18], [-0.38, 0.18]]"
      footprint_padding: 0.0
      track_unknown_space: true
      plugins: [static_layer, obstacle_layer, inflation_layer]
      inflation_layer:
        cost_scaling_factor: 5.0
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        observation_sources: go2_cloud
        go2_cloud:
          topic: /vlm_nav/obstacle_cloud
          sensor_frame: base_link
          data_type: PointCloud2
          marking: true
          clearing: true
          raytrace_min_range: 0.10
          raytrace_max_range: 8.0
          obstacle_min_range: 0.10
          obstacle_max_range: 8.0
          # Cloud heights are transformed into map; include the 0.30 m
          # crouch/stand change of base_link as well as the filtered cloud.
          min_obstacle_height: -0.15
          max_obstacle_height: 0.75

local_costmap:
  local_costmap:
    ros__parameters:
      global_frame: odom
      robot_base_frame: base_link
      footprint: "[[0.38, 0.18], [0.38, -0.18], [-0.38, -0.18], [-0.38, 0.18]]"
      footprint_padding: 0.0
      rolling_window: true
      plugins: [voxel_layer, inflation_layer]
      inflation_layer:
        cost_scaling_factor: 5.0
      voxel_layer:
        plugin: nav2_costmap_2d::VoxelLayer
        # odom->base_link z changes by about 0.30 m between crouched and
        # standing poses.  Keep the sensor origin and filtered cloud inside
        # the voxel grid throughout that physical range.
        origin_z: -0.20
        z_resolution: 0.0625
        z_voxels: 16
        observation_sources: go2_cloud
        go2_cloud:
          topic: /vlm_nav/obstacle_cloud
          sensor_frame: base_link
          data_type: PointCloud2
          marking: true
          clearing: true
          raytrace_min_range: 0.10
          raytrace_max_range: 8.0
          obstacle_min_range: 0.10
          obstacle_max_range: 8.0
          min_obstacle_height: -0.15
          max_obstacle_height: 0.75

behavior_server:
  ros__parameters:
    global_frame: odom
    robot_base_frame: base_link
    max_rotational_vel: 0.50
    min_rotational_vel: 0.50
    rotational_acc_lim: 0.50
