# Go2 Plan A navigation profile. Footprint and obstacle heights remain blocked
# in robot_go2.yaml until measured; this file only defines controller semantics.
controller_server:
  ros__parameters:
    controller_frequency: 20.0
    progress_checker_plugins: [progress_checker]
    goal_checker_plugins: [general_goal_checker]
    controller_plugins: [FollowPath]
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.10
      movement_time_allowance: 15.0
    general_goal_checker:
      plugin: nav2_controller::PositionGoalChecker
      xy_goal_tolerance: 0.05
      stateful: true
    FollowPath:
      plugin: dwb_core::DWBLocalPlanner
      min_vel_x: 0.0
      min_vel_y: 0.0
      max_vel_x: 0.20
      max_vel_y: 0.0
      max_vel_theta: 0.40
      min_speed_xy: 0.0
      max_speed_xy: 0.20
      min_speed_theta: 0.0
      acc_lim_x: 0.20
      acc_lim_y: 0.0
      acc_lim_theta: 0.40
      decel_lim_x: -0.20
      decel_lim_y: 0.0
      decel_lim_theta: -0.40
      vx_samples: 12
      vy_samples: 1
      vtheta_samples: 20
      sim_time: 1.0
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.50
      short_circuit_trajectory_evaluation: true
      stateful: true
      critics: [RotateToGoal, Oscillation, BaseObstacle, GoalAlign, PathAlign, PathDist, GoalDist]
      BaseObstacle.scale: 0.02
      PathAlign.scale: 32.0
      GoalAlign.scale: 24.0
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0

velocity_smoother:
  ros__parameters:
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: OPEN_LOOP
    max_velocity: [0.20, 0.0, 0.40]
    min_velocity: [-0.20, 0.0, -0.40]
    max_accel: [0.20, 0.0, 0.40]
    max_decel: [-0.20, 0.0, -0.40]
    odom_topic: /odometry
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 0.5

global_costmap:
  global_costmap:
    ros__parameters:
      global_frame: map
      robot_base_frame: base_link
      footprint: TBD / requires measurement
      footprint_padding: TBD / requires measurement
      track_unknown_space: true
      plugins: [static_layer, obstacle_layer, inflation_layer]
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        observation_sources: go2_cloud
        go2_cloud:
          topic: /vlm_nav/obstacle_cloud
          sensor_frame: utlidar_lidar
          data_type: PointCloud2
          marking: true
          clearing: true
          raytrace_min_range: TBD / requires measurement
          raytrace_max_range: TBD / requires measurement
          obstacle_min_range: TBD / requires measurement
          obstacle_max_range: TBD / requires measurement
          min_obstacle_height: TBD / requires measurement
          max_obstacle_height: TBD / requires measurement

local_costmap:
  local_costmap:
    ros__parameters:
      global_frame: odom
      robot_base_frame: base_link
      footprint: TBD / requires measurement
      footprint_padding: TBD / requires measurement
      rolling_window: true
      plugins: [voxel_layer, inflation_layer]
      voxel_layer:
        plugin: nav2_costmap_2d::VoxelLayer
        origin_z: TBD / requires measurement
        z_resolution: TBD / requires measurement
        z_voxels: TBD / requires measurement
        observation_sources: go2_cloud
        go2_cloud:
          topic: /vlm_nav/obstacle_cloud
          sensor_frame: utlidar_lidar
          data_type: PointCloud2
          marking: true
          clearing: true
          raytrace_min_range: TBD / requires measurement
          raytrace_max_range: TBD / requires measurement
          obstacle_min_range: TBD / requires measurement
          obstacle_max_range: TBD / requires measurement
          min_obstacle_height: TBD / requires measurement
          max_obstacle_height: TBD / requires measurement

behavior_server:
  ros__parameters:
    global_frame: odom
    robot_base_frame: base_link
    max_rotational_vel: 0.25
    min_rotational_vel: 0.10
    rotational_acc_lim: 0.30
